# Supabase'ni uyquga ketishdan saqlaydi VA nosozlikdan xabar beradi.
#
# NEGA KERAK:
# Supabase bepul tarifi 7 kun davomida hech qanday so'rov bo'lmasa loyihani
# to'xtatib qo'yadi. Bu ish kuniga ikki marta /api/health ni ochadi — u har
# bir jadvalga murojaat qiladi, ya'ni baza "faol" hisoblanadi.
#
# QO'SHIMCHA FOYDA:
# /api/health nosoz javob qaytarsa (masalan baza yiqilgan yoki kalit
# almashtirilgan), bu ish MUVAFFAQIYATSIZ tugaydi va GitHub repozitoriya
# egasiga avtomatik xat yuboradi. Ya'ni muammoni mijozdan emas, o'zingiz
# birinchi bo'lib bilasiz. Alohida kuzatuv xizmati kerak emas.
#
# DIQQAT: GitHub 60 kun davomida hech qanday harakat bo'lmagan repozitoriyada
# jadval bo'yicha ishlarni O'CHIRIB qo'yadi (va bu haqda xat yuboradi).
# Shuning uchun vercel.json da ikkinchi, mustaqil ping ham bor.

name: Keep alive

on:
  schedule:
    # Kuniga ikki marta: 03:00 va 15:00 UTC (Toshkent vaqti 08:00 va 20:00).
    # 7 kunlik chegara uchun bu ancha zaxira bilan yetarli.
    - cron: "0 3,15 * * *"
  # Tugma bosib qo'lda ham ishga tushirish mumkin
  workflow_dispatch:

# Bir vaqtda bittadan ortiq ishlamasin
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Saytni tekshirish va bazani uyg'oq saqlash
        # Manzil env orqali uzatiladi — shunda u skript matniga qo'shilib
        # ketmaydi (buyruq almashtirish xavfi bo'lmaydi).
        # Boshqa manzil kerak bo'lsa: Settings → Variables → HEALTH_URL
        env:
          URL: ${{ vars.HEALTH_URL || 'https://uzgrow.uz/api/health' }}
        run: |
          echo "Tekshirilmoqda: $URL"

          # Uch marta urinamiz — bir martalik tarmoq uzilishi tufayli
          # bekorga ogohlantirish yubormaslik uchun.
          for attempt in 1 2 3; do
            echo "--- urinish $attempt ---"
            code=$(curl -sS -L --max-time 60 -o response.json -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP: $code"
            cat response.json 2>/dev/null || true
            echo

            if [ "$code" = "200" ] && grep -q '"ok":true' response.json; then
              echo "✅ Hammasi ishlayapti, baza uyg'otildi."
              exit 0
            fi

            if [ $attempt -lt 3 ]; then
              echo "Muvaffaqiyatsiz, 30 soniyadan keyin qayta urinamiz..."
              sleep 30
            fi
          done

          echo "::error::Sayt yoki Supabase javob bermayapti. Javob yuqorida."
          echo "Tekshiring: $URL"
          exit 1
